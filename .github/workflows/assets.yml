name: ClipTown asset integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      - name: Verify deterministic local asset receipts
        run: node scripts/asset-receipts.mjs > "$RUNNER_TEMP/cliptown-asset-receipts.json"
      - run: node scripts/verify-assets.mjs
